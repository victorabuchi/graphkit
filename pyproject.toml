[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphkit"
version = "0.1.0"
description = "Draw art in your GitHub contribution graph and mirror real commit dates from other repos"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
graphkit = "graphkit:main"

[tool.setuptools]
py-modules = ["graphkit"]
